[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-business-analyst-service"
version = "0.1.0"
description = "Isolated CPython 3.11 HTTP wrapper around canonical config/business BA engines."
requires-python = ">=3.11,<3.12"
readme = "README.md"
dependencies = [
  "starlette==0.46.2",
  "uvicorn==0.34.3",
  "anyio==4.9.0",
  "PyJWT==2.10.1",
  "httpx==0.28.1",
  "h11==0.14.0",
  "click==8.1.8",
  "sniffio==1.3.1",
  "idna==3.10",
  "certifi==2025.1.31",
]

[project.optional-dependencies]
# BA ENGINE DEPENDENCIES: none (canonical config/business is stdlib + in-tree JSON).
# BA SERVICE HOST DEPENDENCIES: the list above (Starlette + uvicorn + PyJWT + httpx for tests).

[project.scripts]
atlas-ba-service = "atlas_ba_service.__main__:main"

[tool.setuptools.packages.find]
include = ["atlas_ba_service*"]
