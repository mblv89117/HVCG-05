name: Atlas CI

# Required-check jobs for Elite, Hub, BA, business engines, integration-core,
# and SharePoint/schema. PR CI never deploys. No production environment.
# Path filters are intentionally omitted so required checks always run.

on:
  pull_request:
    branches:
      - main
      - integration/atlas-canonical
  push:
    branches:
      - integration/atlas-canonical
  workflow_dispatch:

concurrency:
  group: atlas-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  elite:
    name: elite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Elite hook lint
        run: npm run lint:hooks
      - name: Elite production build (required by hard-refresh dist tests)
        env:
          VITE_ATLAS_ENV: ci
          VITE_BLOCK_LIVE_CLIENT_COMMS: 'true'
          VITE_ALLOW_SAMPLE_FALLBACK: 'false'
        run: npm run build -w @hvcg/atlas-elite-os
      - name: Elite test suite
        run: npm run test:elite

  hub:
    name: hub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Hub tests
        run: npm run test:integration-api
      - name: Hub typecheck (known debt classified, new errors fail)
        run: node scripts/ci/hub-typecheck-gate.mjs

  business-analyst:
    name: business-analyst
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/atlas-business-analyst-service/requirements.txt
      - name: Install BA service host dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r apps/atlas-business-analyst-service/requirements.txt
      - name: BA service contract tests
        run: python -m unittest apps/atlas-business-analyst-service/tests/test_*.py -v

  business-engine:
    name: business-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Canonical config/business engine tests
        run: python -m unittest discover -s tests/unit/business -v

  integration-core:
    name: integration-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Integration-core typecheck
        run: npm run typecheck -w @hvcg/atlas-integration-core
      - name: Integration-core tests
        run: npm run test -w @hvcg/atlas-integration-core

  sharepoint-validation:
    name: sharepoint-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: SharePoint list schema unit test
        run: python tests/unit/test_schemas.py
      - name: Pre-deployment schema validation (offline)
        run: python tests/validate_predeployment.py
